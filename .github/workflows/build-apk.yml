name: Build APK
on:
  push: {branches: [main]}
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 20}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cp -r android-icons-res/* android/app/src/main/res/
      - run: cp android-src/MainActivity.java android/app/src/main/java/com/originrecords/app/MainActivity.java
      - run: mkdir -p ~/.android && cp android-src/debug.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: origin-records-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
