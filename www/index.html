:root{--bg:#f5f5f6;--sf:#fff;--ink:#111;--mu:#6b6b70;--ln:#e6e6e9;--ac:#6e001b;--lk:#6e001b;--p2:#25042b;--wn:#b5720e;--bd:#d6394a;--sh:0 1px 2px #1111110a,0 6px 18px #11111108;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#111;--sf:#1b1b1d;--ink:#fff;--mu:#a0a0a6;--ln:#2c2c2f;--lk:#fff;--p2:#b9b9c0;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 Montserrat,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:#25042b;color:#d9c9dc;padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
.br{display:flex;gap:10px;align-items:center;color:#fff;font:700 18px Montserrat,sans-serif;padding:2px 8px 16px}.logo-mark{width:30px;height:30px;border-radius:8px;display:inline-block;vertical-align:middle;flex:none}
.nv{display:flex;gap:10px;align-items:center;background:0;border:0;color:inherit;font:inherit;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left}.nv:hover{background:#ffffff14}.nv.on{background:#6e001b;color:#fff}
.col{min-width:0}.tb{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 28px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
main{padding:24px 28px 70px;max-width:1200px}h1{font:700 26px Montserrat,sans-serif;margin:0}h3{margin:0 0 10px;font-size:15px}.sub{color:var(--mu);margin:0;font-size:13px}
.b{display:inline-flex;gap:6px;align-items:center;background:var(--ac);color:#fff;border:2px solid #fff;border-radius:9px;padding:7px 12px;font:700 13px Montserrat,sans-serif;cursor:pointer;margin:0}.b.g{background:0;color:var(--ink);border:1px solid var(--ln)}
.lk{background:0;border:0;color:var(--lk);font:700 13px Montserrat,sans-serif;cursor:pointer;padding:2px 4px;display:inline-flex;gap:4px;align-items:center}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}svg.lucide{width:17px;height:17px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px}.hero{background:#6e001b;color:#fff;border-radius:16px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:12px}
.hero b{display:block;font:700 30px Montserrat,sans-serif}.hero span{opacity:.8;font-size:12px}.hero i{display:block;font-style:normal;opacity:.6;font-size:11px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}.kp b{display:block;font-size:17px;font-weight:700}.kp span{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--ln)}td{padding:9px 10px;border-bottom:1px solid var(--ln)}.n{text-align:right}.tw{overflow-x:auto}tr.t td{font-weight:700}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--mu) 18%,transparent)}.pill.Paid{background:var(--ac);color:#fff}.pill.Overdue{color:var(--bd);background:color-mix(in srgb,var(--bd) 15%,transparent)}.pill.Partial{color:var(--wn);background:color-mix(in srgb,var(--wn) 16%,transparent)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}label{display:block;font-size:12px;font-weight:600;color:var(--mu)}label input,label select{margin-top:4px;font-weight:500}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}.two{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:12px}.rp{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.ov{position:fixed;inset:0;background:#08010ab0;display:grid;place-items:center;padding:16px;z-index:9;overflow:auto}.ov[hidden]{display:none}.md{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:22px;width:min(700px,100%);max-height:92vh;overflow:auto}
#ied{z-index:20}.iedmd{width:min(440px,100%)}
.iedbox{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:10px;overflow:hidden}
.iedbox img{max-width:100%;max-height:48vh;display:block}
.iedov{position:absolute;background:#000000b3;pointer-events:none}
.fprev{display:flex;align-items:center;gap:10px;margin-top:8px}
.fthumb{width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid var(--ln)}
.r{display:grid;grid-template-columns:1fr 70px 110px 42px;gap:8px;margin-bottom:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#25042b;color:#fff;padding:9px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}.toast.on{opacity:1}
.lh{display:flex;gap:16px;align-items:center}.lh img,.av{width:56px;height:56px;border-radius:12px;object-fit:cover}.av{display:grid;place-items:center;background:var(--ac);color:#fff;font:700 18px Montserrat,sans-serif;border:2px solid #fff}.tb .av{width:32px;height:32px;font-size:13px;border-radius:8px}.tb img{width:32px;height:32px;border-radius:8px;object-fit:cover}
.tb>span{display:flex;gap:8px;align-items:center}.tb .b{flex:none}.ib{display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border-radius:10px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);cursor:pointer}.ib:hover{border-color:var(--ac)}
main{margin:0 auto}h1{font-size:28px;letter-spacing:-.02em}.cd{border-radius:16px;padding:20px;box-shadow:var(--sh)}.b{border-radius:10px;padding:10px 16px;transition:filter .15s}.b:hover{filter:brightness(1.15)}.b.g{background:var(--sf)}
.hero{border-radius:20px;padding:28px 30px;gap:0;box-shadow:0 10px 30px #6e001b2e}.hero>div{padding:0 26px}.hero>div:first-child{padding-left:0}.hero>div+div{border-left:1px solid #ffffff30}.hero b{font-size:32px;letter-spacing:-.02em;margin:8px 0 4px}.hero span{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600}
.hero2{display:block}.hero2>div{padding:0!important;border:0!important}.hero2 .hp b{font-size:42px;margin:6px 0 4px}.hero2 .hs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px;padding-top:18px;border-top:1px solid #ffffff2a}.hero2 .hs b{font-size:21px;margin:6px 0 3px}.hero2 .hs>div{min-width:0}
@media(max-width:480px){.hero2 .hp b{font-size:34px}.hero2 .hs b{font-size:18px}.hero2 .hs{gap:12px}}
.kc{display:flex;gap:14px;align-items:center}.kc-top{flex-direction:column;align-items:flex-start;gap:12px;padding:18px}.kc-top>div{padding-right:4px}.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,#6e001b 12%,transparent);color:var(--lk);flex:none}:root[data-theme=dark] .ic{background:#6e001b;color:#fff;border:2px solid #fff}
th{text-transform:uppercase;letter-spacing:.06em;font-size:11px}tr:hover>td{background:color-mix(in srgb,var(--mu) 8%,transparent)}.nv{font-weight:600}.nv.on{box-shadow:inset 0 3px 0 #fff}.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 0 10px;font-weight:700}
@media(max-width:820px){.hero>div{padding:0!important;border:0!important}.hero{gap:18px}}
.app.nc{grid-template-columns:1fr}.app.nc aside,.app.nc .tb{display:none}.wl{max-width:980px;margin:0 auto;padding-top:20px}.wh{background:#6e001b;color:#fff;border-radius:22px;padding:44px 30px;text-align:center}.wh h1{color:#fff;font-size:34px;margin:14px 0 6px}.wh p{opacity:.85;margin:0 auto 22px;max-width:480px}.wh .b{background:#fff;color:#6e001b}.wh .logo-mark{width:56px;height:56px;border-radius:14px}
#bnav{display:none}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#25042b;gap:2px;padding:6px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 16px #00000030}
.bnv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:0;border:0;color:#b9a5bc;font:600 11px Montserrat,sans-serif;padding:8px 2px 7px;border-radius:12px;cursor:pointer;min-width:0}
.bnv span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnv svg.lucide{width:22px;height:22px}
.bnv.on{color:#fff;background:#6e001b;border:2px solid #fff}.bnv.on svg.lucide{color:#fff}
.drw[hidden]{display:none}.drw{position:fixed;inset:0;z-index:12;background:#08010ab5}
